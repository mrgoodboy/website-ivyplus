<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ivy Plus – Stránky v přestavbě</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            padding: 50px;
            color: #333;
        }
        .logo {
            max-width: 200px;
            margin-bottom: 30px;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 500px;
        }
        .lang-switch {
            margin-top: 20px;
            font-size: 14px;
        }
        .contact {
            margin-top: 30px;
            font-size: 16px;
        }
        canvas {
            display: block;
            margin: 30px auto;
            background-color: #000;
        }
        .scoreboard {
            position: absolute;
            right: 30px;
            top: 30px;
            color: white;
            font-size: 18px;
            font-family: Arial, sans-serif;
            text-align: right;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="static/img/navylogo.png" alt="Ivy Plus logo" class="logo">

        <div class="cz">
            <h1>Stránky jsou v přestavbě</h1>
            <p>Na této adrese právě připravujeme nový web.</p>
        </div>

        <div class="vn" style="margin-top: 30px;">
            <h1>Trang web đang được nâng cấp</h1>
            <p>Chúng tôi đang xây dựng lại trang web tại địa chỉ này.</p>
        </div>

        <div class="contact">
            <p><strong>Email:</strong> <a href="mailto:pham@ivyplus.cz">pham@ivyplus.cz</a></p>
            <p><strong>Tel:</strong> <a href="tel:+420778081986">778 081 986</a></p>
        </div>

        <div class="lang-switch">
            &#127760; CZ | VN
        </div>
    </div>

    <div class="scoreboard" id="scoreboard">
        <div>Skóre / Điểm: <span id="score">0</span></div>
        <div>Max skóre / Điểm cao nhất: <span id="maxScore">0</span></div>
        <div>Prohry / Thua: <span id="losses">0</span></div>
    </div>

    <canvas id="pong" width="600" height="400"></canvas>
    <audio id="pingSound">
        <source src="https://freesound.org/data/previews/26/26104_255577-lq.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById("pong");
        const ctx = canvas.getContext("2d");

        const paddleWidthDefault = 100;
        const paddleHeight = 10;
        let paddleWidth = paddleWidthDefault;
        let maxPaddleWidth = canvas.width * 0.6;
        let paddleX = (canvas.width - paddleWidth) / 2;
        const ballRadius = 8;
        let ballX = canvas.width / 2;
        let ballY = canvas.height - 30;
        let dx = 2;
        let dy = -2;
        let rightPressed = false;
        let leftPressed = false;

        let score = 0;
        let maxScore = 0;
        let losses = 0;
        let difficultyTimer = 0;

        const scoreEl = document.getElementById("score");
        const maxScoreEl = document.getElementById("maxScore");
        const lossesEl = document.getElementById("losses");
        const pingSound = document.getElementById("pingSound");

        document.addEventListener("keydown", keyDownHandler, false);
        document.addEventListener("keyup", keyUpHandler, false);

        function keyDownHandler(e) {
            if(e.key === "Right" || e.key === "ArrowRight") {
                rightPressed = true;
            }
            else if(e.key === "Left" || e.key === "ArrowLeft") {
                leftPressed = true;
            }
        }

        function keyUpHandler(e) {
            if(e.key === "Right" || e.key === "ArrowRight") {
                rightPressed = false;
            }
            else if(e.key === "Left" || e.key === "ArrowLeft") {
                leftPressed = false;
            }
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ballX, ballY, ballRadius, 0, Math.PI*2);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
            ctx.fillStyle = "#fff";
            ctx.fill();
            ctx.closePath();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBall();
            drawPaddle();

            if(ballX + dx > canvas.width - ballRadius || ballX + dx < ballRadius) {
                dx = -dx;
                pingSound.currentTime = 0;
                pingSound.play();
            }
            if(ballY + dy < ballRadius) {
                dy = -dy;
                pingSound.currentTime = 0;
                pingSound.play();
            } else if(ballY + dy > canvas.height - ballRadius) {
                if(ballX > paddleX && ballX < paddleX + paddleWidth) {
                    dy = -dy;
                    score++;
                    if(score > maxScore) maxScore = score;
                    pingSound.currentTime = 0;
                    pingSound.play();
                } else {
                    losses++;
                    score = 0;
                    dx = 2;
                    dy = -2;
                    paddleWidth = Math.min(paddleWidthDefault, maxPaddleWidth);
                    setTimeout(() => {
                        ballX = canvas.width / 2;
                        ballY = canvas.height - 30;
                    }, 500);
                }
            }

            if(rightPressed && paddleX < canvas.width - paddleWidth) {
                paddleX += 7;
            }
            else if(leftPressed && paddleX > 0) {
                paddleX -= 7;
            }

            ballX += dx;
            ballY += dy;

            scoreEl.textContent = score;
            maxScoreEl.textContent = maxScore;
            lossesEl.textContent = losses;

            difficultyTimer++;
            if (difficultyTimer % (60 * 60) === 0) {
                dx *= 1.1;
                dy *= 1.1;
            }

            if (losses % 5 === 0 && losses !== 0 && paddleWidth < maxPaddleWidth) {
                setTimeout(() => {
                    paddleWidth = Math.min(paddleWidth * 1.2, maxPaddleWidth);
                }, 3000);
            }

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
