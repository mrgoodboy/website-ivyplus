<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ivy Plus – Stránky v přestavbě</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            padding: 50px;
            color: #333;
        }
        .logo {
            max-width: 200px;
            margin-bottom: 30px;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 500px;
        }
        .lang-switch {
            margin-top: 20px;
            font-size: 14px;
        }
        .contact {
            margin-top: 30px;
            font-size: 16px;
        }
        canvas {
            display: block;
            margin: 30px auto;
            border: 2px solid #333;
            background-color: #e0e0e0;
        }
        .score-board {
            margin-top: 10px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="static/img/navylogo.png" alt="Ivy Plus logo" class="logo">

        <div class="cz">
            <h1>Stránky jsou v přestavbě</h1>
            <p>Na této adrese právě připravujeme nový web.</p>
        </div>

        <div class="vn" style="margin-top: 30px;">
            <h1>Trang web đang được nâng cấp</h1>
            <p>Chúng tôi đang xây dựng lại trang web tại địa chỉ này.</p>
        </div>

        <div class="contact">
            <p><strong>Email:</strong> <a href="mailto:pham@ivyplus.cz">pham@ivyplus.cz</a></p>
            <p><strong>Tel:</strong> <a href="tel:+420778081986">778 081 986</a></p>
        </div>

        <div class="lang-switch">
            &#127760; CZ | VN
        </div>
    </div>

    <div class="score-board" id="scoreBoard">
        Skóre: 0 | Nejvyšší skóre: 0 | Proher: 0<br>
        Điểm số: 0 | Điểm cao nhất: 0 | Thua: 0
    </div>

    <canvas id="gameCanvas" width="500" height="300"></canvas>

    <script>
        // Sem se vloží JavaScript pro hru s odkazem na prvek scoreBoard
    </script>
</body>
</html>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let paddleWidth = 100;
        const paddleHeight = 10;
        let paddleX = (canvas.width - paddleWidth) / 2;
        let ballX = canvas.width / 2;
        let ballY = canvas.height - 30;
        let ballRadius = 10;
        let dx = 2;
        let dy = -2;
        let rightPressed = false;
        let leftPressed = false;
        let score = 0;
        let highScore = 0;
        let losses = 0;
        let difficultyLevel = 1;
        let totalTime = 0;

        document.addEventListener("keydown", keyDownHandler, false);
        document.addEventListener("keyup", keyUpHandler, false);

        function keyDownHandler(e) {
            if(e.key === "Right" || e.key === "ArrowRight") rightPressed = true;
            else if(e.key === "Left" || e.key === "ArrowLeft") leftPressed = true;
        }
        function keyUpHandler(e) {
            if(e.key === "Right" || e.key === "ArrowRight") rightPressed = false;
            else if(e.key === "Left" || e.key === "ArrowLeft") leftPressed = false;
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
            ctx.fillStyle = "#0095DD";
            ctx.fill();
            ctx.closePath();
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ballX, ballY, ballRadius, 0, Math.PI*2);
            ctx.fillStyle = "#0095DD";
            ctx.fill();
            ctx.closePath();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBall();
            drawPaddle();

            if(ballX + dx > canvas.width - ballRadius || ballX + dx < ballRadius) dx = -dx;
            if(ballY + dy < ballRadius) dy = -dy;
            else if(ballY + dy > canvas.height - ballRadius) {
                if(ballX > paddleX && ballX < paddleX + paddleWidth) {
                    dy = -dy;
                    score++;
                    if(score > highScore) highScore = score;
                    document.getElementById("score").innerText = score;
                    document.getElementById("highScore").innerText = highScore;
                    document.getElementById("score-vn").innerText = score;
                    document.getElementById("highScore-vn").innerText = highScore;
                } else {
                    losses++;
                    document.getElementById("losses").innerText = losses;
                    document.getElementById("losses-vn").innerText = losses;
                    if(losses % 5 === 0) {
                        paddleWidth = Math.min(canvas.width * 0.6, paddleWidth * 1.2);
                    }
                    score = 0;
                    ballX = canvas.width/2;
                    ballY = canvas.height - 30;
                    dx = 2 * difficultyLevel;
                    dy = -2 * difficultyLevel;
                }
            }

            if(rightPressed && paddleX < canvas.width - paddleWidth) paddleX += 7;
            else if(leftPressed && paddleX > 0) paddleX -= 7;

            ballX += dx;
            ballY += dy;

            requestAnimationFrame(draw);
        }

        setInterval(() => {
            totalTime++;
            if(totalTime % 60 === 0) difficultyLevel++;
        }, 1000);

        draw();
    </script>
</body>
</html>
