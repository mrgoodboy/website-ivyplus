<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ivy Plus – Stránky v přestavbě</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            padding: 50px;
            color: #333;
        }
        .logo {
            max-width: 200px;
            margin-bottom: 30px;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: inline-block;
            max-width: 500px;
        }
        .lang-switch {
            margin-top: 20px;
            font-size: 14px;
        }
        .contact {
            margin-top: 30px;
            font-size: 16px;
        }
        canvas {
            margin-top: 40px;
            background: #eee;
            border: 2px solid #555;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="static/img/navylogo.png" alt="Ivy Plus logo" class="logo">

        <div class="cz">
            <h1>Stránky jsou v přestavbě</h1>
            <p>Na této adrese právě připravujeme nový web.</p>
        </div>

        <div class="vn" style="margin-top: 30px;">
            <h1>Trang web đang được nâng cấp</h1>
            <p>Chúng tôi đang xây dựng lại trang web tại địa chỉ này.</p>
        </div>

        <div class="contact">
            <p><strong>Email:</strong> <a href="mailto:pham@ivyplus.cz">pham@ivyplus.cz</a></p>
            <p><strong>Tel:</strong> <a href="tel:+420778081986">778 081 986</a></p>
        </div>

        <div class="lang-switch">
            &#127760; CZ | VN
        </div>
    </div>

    <!-- Jednoduchá hra Breakout -->
    <canvas id="breakout" width="300" height="400"></canvas>
    <script>
        const canvas = document.getElementById("breakout");
        const ctx = canvas.getContext("2d");

        const ballRadius = 8;
        let x = canvas.width / 2;
        let y = canvas.height - 30;
        let dx = 2;
        let dy = -2;

        const paddleHeight = 10;
        const paddleWidth = 75;
        let paddleX = (canvas.width - paddleWidth) / 2;

        let rightPressed = false;
        let leftPressed = false;

        document.addEventListener("keydown", keyDownHandler);
        document.addEventListener("keyup", keyUpHandler);

        function keyDownHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") {
                rightPressed = true;
            } else if (e.key === "Left" || e.key === "ArrowLeft") {
                leftPressed = true;
            }
        }

        function keyUpHandler(e) {
            if (e.key === "Right" || e.key === "ArrowRight") {
                rightPressed = false;
            } else if (e.key === "Left" || e.key === "ArrowLeft") {
                leftPressed = false;
            }
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
            ctx.fillStyle = "#0095DD";
            ctx.fill();
            ctx.closePath();
        }

        function drawPaddle() {
            ctx.beginPath();
            ctx.rect(paddleX, canvas.height - paddleHeight, paddleWidth, paddleHeight);
            ctx.fillStyle = "#0095DD";
            ctx.fill();
            ctx.closePath();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBall();
            drawPaddle();

            if (x + dx > canvas.width - ballRadius || x + dx < ballRadius) {
                dx = -dx;
            }
            if (y + dy < ballRadius) {
                dy = -dy;
            } else if (y + dy > canvas.height - ballRadius) {
                if (x > paddleX && x < paddleX + paddleWidth) {
                    dy = -dy;
                } else {
                    alert("Konec hry");
                    document.location.reload();
                }
            }

            if (rightPressed && paddleX < canvas.width - paddleWidth) {
                paddleX += 5;
            } else if (leftPressed && paddleX > 0) {
                paddleX -= 5;
            }

            x += dx;
            y += dy;

            requestAnimationFrame(draw);
        }

        draw();
    </script>
</body>
</html>
